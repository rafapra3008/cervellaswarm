# CI Workflow for @cervellaswarm/core
#
# Runs on push/PR when package files change.
# Matrix: Node 20.x, 22.x
#
# Quality is not negotiable.

name: Core CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# S515: least privilege GITHUB_TOKEN scope (Ops verified P0)
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'packages/core/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/core

      - name: Build
        run: npm run build
        working-directory: packages/core

      - name: Run tests
        run: npm test
        working-directory: packages/core

      - name: Generate coverage (Node 20 only)
        if: matrix.node-version == '20.x'
        continue-on-error: true
        run: npm run test:coverage
        working-directory: packages/core
