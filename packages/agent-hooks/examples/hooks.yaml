# CervellaSwarm Agent Hooks - Configuration
#
# Place this file in one of:
#   1. .cervella/hooks.yaml   (project-level, recommended)
#   2. ~/.claude/hooks.yaml   (user-level default)
#   3. Set CERVELLA_HOOKS_CONFIG=/path/to/hooks.yaml
#
# All sections are optional. Hooks use sensible defaults when omitted.

# ---------------------------------------------------------------------------
# File Limits - Prevent file bloat (SessionEnd hook)
# ---------------------------------------------------------------------------
file_limits:
  checks:
    - pattern: "SESSION_STATE.md"
      name: "Session state file"
      max_lines: 300
      action: "Archive old sessions to .archive/"

    - pattern: "reports/*.json"
      name: "Report files"
      max_count: 50
      action: "Archive old reports"

# ---------------------------------------------------------------------------
# Context Injection - Inject project context into subagents (SubagentStart)
# ---------------------------------------------------------------------------
context_inject:
  # File with verified facts that agents should never contradict
  facts_file: "docs/FACTS.md"
  facts_max_lines: 100

  # File with current project state (session resume)
  state_file: "SESSION_STATE.md"
  state_max_lines: 50

# ---------------------------------------------------------------------------
# Session Checkpoint - Auto-save state at session end (SessionEnd/PreCompact)
# ---------------------------------------------------------------------------
session_checkpoint:
  state_file: "SESSION_STATE.md"
  include_git_status: true
  include_recent_commits: true
  max_lines: 200

# ---------------------------------------------------------------------------
# Git Reminder - Notify about uncommitted files (Stop hook)
# ---------------------------------------------------------------------------
git_reminder:
  interval_minutes: 30

# ---------------------------------------------------------------------------
# Bash Validator - Extra patterns (PreToolUse hook)
# ---------------------------------------------------------------------------
bash_validator:
  # Add your own blocked command patterns (regex)
  extra_blocked:
    # - pattern: "kubectl delete namespace production"
    #   reason: "Never delete production namespace"

  # Add your own risky command patterns (regex)
  extra_risky:
    # - pattern: "terraform destroy"
    #   reason: "terraform destroy removes infrastructure"

  # Add your own safe rm -rf targets (regex)
  extra_safe_rm:
    # - ".angular/?"

# ---------------------------------------------------------------------------
# Quality Validator - SNCP 5.1 metrics (SessionEnd hook, S519 P4.4)
# Validates PROMPT_RIPRESA quality (6 metrics, mai blocco, sempre warning).
# State detection 3-state A/B/C (legacy 5.0 / partial split / complete 5.1).
# Disable via env var: SNCP_QUALITY_VALIDATOR_DISABLE=1
# ---------------------------------------------------------------------------
quality_validator:
  # Metric 1: Density (H2/H3 + action bullets) / righe totali
  density_min: 0.30
  density_max: 0.55

  # Metric 2: Recency scope-restricted (DOVE SIAMO + ProxStep sezioni)
  recency_max_old_pct: 0.30   # max 30% entries >90gg
  recency_min_recent_h2: 2    # min 2 H2 <=14gg in DOVE SIAMO

  # Metric 3: Coverage sezioni obbligatorie
  coverage_hard:              # FAIL se mancano tutte 3
    - "status"
    - "dove siamo"
    - "puntator"
  coverage_warn:              # WARN se mancano
    - "prossim"
    - "lezion"

  # Metric 4: Actionability (step con owner+effort in ProxStep)
  actionability_min: 3

  # Metric 5: Anti-rot (% path navigabili come markdown link)
  anti_rot_min_pct: 0.80

  # Metric 6: Self-sufficiency (prime N righe rispondono 3 boolean Q)
  self_sufficiency_lines: 50

  # Migration policy: PROMPT_RIPRESA < N righe restano single-file (SNCP 5.0)
  split_threshold_lines: 150

  # Report dir relativa a project root
  report_dir: ".sncp/reports/daily"
